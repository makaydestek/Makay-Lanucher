name: CI

on:
  pull_request:
  push:
    branches: [main]

# Salt okunur: bu workflow yayina ve latest.json'a dokunmaz.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Action'lar commit SHA'ya sabitlendi (tag yeniden yönlendirilebilir).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Java 17 kurulum
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle önbellekleme
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Gradle wrapper izinleri
        run: chmod +x gradlew

      - name: Birim testleri
        run: ./gradlew testDebugUnitTest

      - name: Lint denetimi
        run: ./gradlew lintDebug
