name: Release

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (ornek: v1.0.8)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: APK hash ve latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          if [[ -z "$TAG" ]]; then
            TAG="$(gh release list --repo "$REPO" --limit 1 --json tagName --jq '.[0].tagName')"
          fi
          if [[ -z "$TAG" ]]; then
            echo "Tag bulunamadi."
            exit 1
          fi
          VERSION="${TAG#v}"

          mapfile -t ASSETS < <(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')
          APK=""
          for name in "${ASSETS[@]}"; do
            if [[ "$name" == *.apk && "$name" != *.apk.sha256 ]]; then
              APK="$name"
              break
            fi
          done
          if [[ -z "$APK" ]]; then
            echo "Release icinde APK yok. Tag olusturup APK ekleyin."
            exit 0
          fi

          gh release download "$TAG" --repo "$REPO" --pattern "$APK" --clobber
          HASH="$(sha256sum "$APK" | awk '{print $1}')"
          SHA_NAME="${APK}.sha256"
          printf '%s %s\n' "$HASH" "$APK" > "$SHA_NAME"

          REMOTE_LINE=""
          if printf '%s\n' "${ASSETS[@]}" | grep -Fxq "$SHA_NAME"; then
            gh release download "$TAG" --repo "$REPO" --pattern "$SHA_NAME" --output /tmp/remote.sha256
            REMOTE_LINE="$(tr -d '\r\n' < /tmp/remote.sha256)"
          fi
          LOCAL_LINE="$(tr -d '\r\n' < "$SHA_NAME")"
          if [[ "$REMOTE_LINE" == "$LOCAL_LINE" ]]; then
            echo "SHA dosyasi guncel, yukleme atlandi."
          else
            gh release upload "$TAG" "$SHA_NAME" --repo "$REPO" --clobber
          fi

          CODE=1
          if [[ -f latest.json ]]; then
            OLD_NAME="$(python3 -c 'import json; print(json.load(open("latest.json")).get("versionName",""))')"
            OLD_CODE="$(python3 -c 'import json; print(int(json.load(open("latest.json")).get("versionCode") or 0))')"
            if [[ "$OLD_NAME" == "$VERSION" ]]; then
              CODE="$OLD_CODE"
            else
              CODE="$((OLD_CODE + 1))"
            fi
          fi
          [[ "$CODE" -lt 1 ]] && CODE=1

          APK_URL="https://github.com/${REPO}/releases/download/${TAG}/${APK}"
          python3 - <<PY
          import json
          data = {
            "versionName": "${VERSION}",
            "versionCode": int("${CODE}"),
            "apkUrl": "${APK_URL}",
            "notes": "${APK}",
          }
          open("latest.json", "w", encoding="utf-8").write(json.dumps(data, separators=(",", ":")))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          if git diff --cached --quiet; then
            echo "latest.json zaten guncel."
          else
            git commit -m "latest.json ${VERSION}"
            git push
          fi
